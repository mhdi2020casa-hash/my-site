<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKATSUKI STREETWEAR | Anime Hoodies Collection 👹</title>

    <!-- Social Media Link Preview Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mhdi2020casa-hash.github.io/my-site/">
    <meta property="og:title" content="AKATSUKI STREETWEAR 👹 Anime Hoodies Store">
    <meta property="og:description" content="Afdal majmo3a d-qobiyat Anime & Streetwear Style f l-Maghrib. Paiement à la livraison!">
    <meta property="og:image" content="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=1200&q=80">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0b0e;
            --bg-card: #12141a;
            --accent: #e63946;
            --accent-hover: #c92a37;
            --text-main: #f1f3f5;
            --text-muted: #868e96;
            --border: #1e222d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        .top-bar {
            background: var(--accent);
            color: #fff;
            text-align: center;
            padding: 9px 10px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 8%;
            background: rgba(10, 11, 14, 0.98);
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-svg {
            width: 42px;
            height: 42px;
            filter: drop-shadow(0 0 8px rgba(230, 57, 70, 0.8));
        }

        .logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .cart-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .cart-btn:hover {
            border-color: var(--accent);
        }

        .cart-badge {
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 12px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            background: linear-gradient(180deg, rgba(10, 11, 14, 0.85) 0%, var(--bg-main) 100%), 
                        url('https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=1200&q=80') center/cover;
            border-bottom: 1px solid var(--border);
        }

        .hero h1 {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 17px;
            max-width: 600px;
            margin: 0 auto;
        }

        .controls-container {
            padding: 25px 8% 10px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .search-bar {
            position: relative;
            width: 100%;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--accent);
        }

        .search-bar i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
            padding: 25px 8% 60px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s transform, 0.3s border-color;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            background: #f8f9fa; /* Clean background for hoodie mockups */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .product-img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: 0.4s transform;
        }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.05);
        }

        .tag-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .product-details {
            padding: 20px;
        }

        .product-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .product-price {
            color: var(--accent);
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        /* Color Selector */
        .option-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .color-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .color-dot.selected {
            border-color: var(--accent);
            transform: scale(1.15);
        }

        /* Size Selector */
        .size-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .size-btn {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .size-btn.selected, .size-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .add-cart-btn {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .add-cart-btn:hover {
            background: var(--accent-hover);
        }

        /* Cart Drawer */
        .cart-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: flex-end;
            backdrop-filter: blur(5px);
        }

        .cart-drawer {
            background: var(--bg-card);
            width: 100%;
            max-width: 460px;
            height: 100%;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-left: 2px solid var(--accent);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }

        .close-cart {
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-items-list {
            flex-grow: 1;
            margin: 20px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-info h4 {
            font-size: 15px;
            margin-bottom: 4px;
            color: #fff;
        }

        .cart-item-info span {
            color: var(--text-muted);
            font-size: 13px;
        }

        .cart-item-price {
            color: var(--accent);
            font-weight: 800;
        }

        .remove-icon {
            color: #ff4757;
            cursor: pointer;
            margin-left: 15px;
        }

        .checkout-box {
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            margin-bottom: 10px;
            outline: none;
            font-size: 14px;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
            margin: 18px 0;
        }

        .whatsapp-submit {
            width: 100%;
            background: #25D366;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }

        .whatsapp-submit:hover {
            background: #1eb954;
        }
    </style>
</head>
