<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Optimization</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #ff4757;
        }
        p {
            font-size: 15px;
            color: #a4b0be;
            margin-bottom: 30px;
        }
        .progress-bar {
            width: 80%;
            max-width: 300px;
            height: 8px;
            background: #2f3542;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #ff4757;
            transition: width 0.4s ease;
        }
        .percentage {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }
        /* Style dial l-message l-akhir li ghadi ytla3 */
        #prank-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #prank-screen h2 {
            font-size: 32px;
            color: #2ed573;
            margin-bottom: 10px;
        }
        #prank-screen p {
            font-size: 18px;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- L-mar7la l-wla: Scanning -->
    <div id="scan-screen">
        <div class="icon">⚠️</div>
        <h1>SECURITY WARNING</h1>
        <p>Suspicious activity detected on this device. Scanning and removing threats...</p>

        <div class="progress-bar">
            <div id="fill" class="progress-fill"></div>
        </div>
        <div id="percent" class="percentage">0%</div>
    </div>

    <!-- L-mar7la t-tanya: Ila weslat 100% katban hadi -->
    <div id="prank-screen">
        <div class="icon">😂</div>
        <h2>RAK TCHEDITI!</h2>
        <p>Matkhl3ch, rah gha prank dwiwza! Hahaha 🎭🔥</p>
        <button onclick="location.reload()" style="margin-top: 20px; padding: 12px 24px; background: #2ed573; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">3awd l-L3iba 🔄</button>
    </div>

    <script>
        let p = 0;
        let interval = setInterval(function() {
            p += Math.floor(Math.random() * 5) + 2; // Katzid bchwiya
            if (p >= 100) {
                p = 100;
                clearInterval(interval);
                
                // Mni twsal 100%, nkfio scan-screen w nbyano prank-screen
                setTimeout(function() {
                    document.getElementById('scan-screen').style.display = 'none';
                    document.getElementById('prank-screen').style.display = 'flex';
                }, 500);
            }
            document.getElementById('fill').style.width = p + '%';
            document.getElementById('percent').innerText = p + '%';
        }, 150);
    </script>

</body>
</html>
