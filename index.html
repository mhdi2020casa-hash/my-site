<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Alert</title>
    <style>
        body {
            background-color: black;
            color: red;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer; /* Bach yban l-user anna l-écran cliquable */
        }
        h1 {
            font-size: 45px;
            text-shadow: 0px 0px 20px red;
            animation: flicker 0.15s infinite;
        }
        p {
            font-size: 20px;
            color: #fff;
            margin-top: 15px;
        }
        .ip-address {
            color: yellow;
            font-weight: bold;
        }
        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body onclick="startPrank()">

    <!-- Screen dial l-Khlc direkt -->
    <h1>⚠️ ATTENTION: SYSTEM COMPROMISED ⚠️</h1>
    <p>Suspicious activity detected on this IP: <span class="ip-address">173.245.48.0</span></p>
    <p>Your location has been tracked. Data extraction is in progress...</p>
    <p style="color: #00ff00; font-size: 14px; margin-top: 30px;">(Kiki f ay blasa bach tkml l-3amaliya)</p>

    <script>
        let triggered = false;

        function startPrank() {
            if (triggered) return; // Bash mat3awdch tkhdm mra okhra ila clika tani
            triggered = true;

            // 1. Sawt dyal l-Telephone (Text-to-Speech)
            if ('speechSynthesis' in window) {
                var utterance = new SpeechSynthesisUtterance("Warning! System hacked! Your phone is compromised!");
                utterance.rate = 1.0;
                utterance.pitch = 0.5;
                window.speechSynthesis.speak(utterance);
            }

            // 2. Dir Fullscreen
            var el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen();
            }

            // 3. Mor 5 saniyat, tla3 l-message dyalak
            setTimeout(function() {
                alert("Malak makhloç? Mtkhlaç ma walo ra dahkin! 😂🔥");
            }, 5000);
        }
    </script>

</body>
</html>
