<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKATSUKI STREETWEAR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #1a1a1e;
            border-bottom: 2px solid #e63946;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #e63946;
            text-transform: uppercase;
        }

        .cart-icon {
            font-size: 22px;
            cursor: pointer;
            position: relative;
            color: #fff;
        }

        #cart-count {
            background: #e63946;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 12px;
            position: absolute;
            top: -8px;
            right: -12px;
            font-weight: bold;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 50px 20px;
            background: #1a1a1e;
            border-bottom: 1px solid #2a2a30;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #fff;
            text-transform: uppercase;
        }

        .hero p {
            color: #a0a0a0;
            font-size: 16px;
        }

        /* Search & Filters */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 25px 8% 10px;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: #1a1a1e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0a0a0;
        }

        .category-filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .filter-btn {
            background: #1a1a1e;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
            font-weight: 600;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #e63946;
            border-color: #e63946;
        }

        /* Products Grid */
        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            padding: 30px 8% 60px;
        }

        .product-card {
            background: #1a1a1e;
            border: 1px solid #2a2a30;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #e63946;
        }

        .product-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #25252b;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }

        .product-price {
            color: #e63946;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .add-to-cart {
            width: 100%;
            padding: 10px;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        .add-to-cart:hover {
            background: #c02633;
        }

        /* Cart Modal Drawer */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: flex-end;
            z-index: 1000;
        }
