<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKATSUKI STREETWEAR | Hoodies Collection 👹</title>

    <!-- Social Media Link Preview Tags (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mhdi2020casa-hash.github.io/my-site/">
    <meta property="og:title" content="AKATSUKI STREETWEAR 👹 Hoodies Collection">
    <meta property="og:description" content="Afdal majmo3a d-qobiyat (Hoodies) Oversized w Ninja Style f l-Maghrib. Livraison partout au Maroc - Paiement à la livraison!">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #08090a;
            --bg-card: #101216;
            --accent: #e63946;
            --accent-hover: #c92a37;
            --text-main: #f1f3f5;
            --text-muted: #868e96;
            --border: #1a1d24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        .top-bar {
            background: var(--accent);
            color: #fff;
            text-align: center;
            padding: 9px 10px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 8%;
            background: rgba(8, 9, 10, 0.98);
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .logo-svg {
            width: 44px;
            height: 44px;
            filter: drop-shadow(0 0 8px rgba(230, 57, 70, 0.8));
        }

        .logo-text {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .cart-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 11px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .cart-btn:hover {
            border-color: var(--accent);
            background: #15181e;
        }

        .cart-badge {
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 12px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            background: #101216;
            border-bottom: 1px solid var(--border);
        }

        .hero h1 {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 12px;
            text-transform: uppercase;
            color: #fff;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 17px;
            max-width: 650px;
            margin: 0 auto;
        }

        .controls-container {
            padding: 30px 8% 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-bar {
            position: relative;
            width: 100%;
        }

        .search-bar input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--accent);
            background: #15181e;
        }

        .search-bar i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 30px 8% 70px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s transform, 0.3s border-color, 0.3s box-shadow;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.2);
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 330px;
            background: #f1f2f6; /* Flat white-gray mockup background like Puma */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .product-img-wrapper svg {
            width: 85%;
            height: 85%;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
            transition: 0.4s transform;
        }

        .product-card:hover .product-img-wrapper svg {
            transform: scale(1.05);
        }

        .tag-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--accent);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }

        .product-details {
            padding: 22px;
        }

        .product-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .product-price {
            color: var(--accent);
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 16px;
        }

        .option-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .color-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .color-dot.selected {
            border-color: var(--accent);
            transform: scale(1.15);
        }

        .size-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .size-btn {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .size-btn.selected, .size-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .add-cart-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }

        .add-cart-btn:hover {
            background: var(--accent-hover);
        }

        .cart-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: flex-end;
            backdrop-filter: blur(5px);
        }

        .cart-drawer {
            background: var(--bg-card);
            width: 100%;
            max-width: 480px;
            height: 100%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-left: 2px solid var(--accent);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .cart-header h2 {
            font-weight: 900;
            text-transform: uppercase;
        }

        .close-cart {
            font-size: 30px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-items-list {
            flex-grow: 1;
            margin: 25px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-info h4 {
            font-size: 16px;
            margin-bottom: 5px;
            color: #fff;
        }

        .cart-item-info span {
            color: var(--text-muted);
            font-size: 14px;
        }

        .cart-item-price {
            color: var(--accent);
            font-weight: 900;
            font-size: 18px;
        }

        .remove-icon {
            color: #ff4757;
            cursor: pointer;
            margin-left: 18px;
            font-size: 18px;
        }

        .checkout-box {
            border-top: 1px solid var(--border);
            padding-top: 25px;
            margin-top: auto;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            margin-bottom: 12px;
            outline: none;
            font-size: 15px;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: 900;
            margin: 20px 0;
            padding: 10px 0;
            border-top: 1px solid var(--border);
        }

        .whatsapp-submit {
            width: 100%;
            background: #25D366;
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="top-bar">🔥 LIVRAISON PARTOUT AU MAROC - PAIEMENT À LA LIVRAISON 🔥</div>

    <header>
        <a href="#" class="logo-container">
            <svg class="logo-svg" viewBox="0 0 200 200">
                <circle cx="100" cy="100" r="90" fill="#101216" stroke="#e63946" stroke-width="8"/>

    <section class="hero">

    <div class="controls-container">

    <main class="products-grid" id="products-list"></main>

    <!-- Cart Drawer Modal -->
    <div class="cart-overlay" id="cart-modal">
        <div class="cart-drawer">
            <div class="cart-header">
                <h2>Mon Panier</h2>
                <span class="close-cart" onclick="toggleCart()">&times;</span>

                    <option value="">Khtar l-Madina</option>
                    <option value="Casablanca">Casablanca</option>

                    <option value="Tanger">Tanger</option>

                    <option value="Fes">Fès</option>
                    <option value="Meknes">Meknès</option>

            <button class="whatsapp-submit" onclick="sendToWhatsApp()">

    <script>
        const WHATSAPP_NUMBER = "212702418961";

        // Function to generate clean vector 2D Flat Hoodie SVG Mockups (Like Puma design)
        function renderHoodieSVG(colorHex, designType) {
            let chestDesign = '';

            if (designType === 'cloud') {
                // Akatsuki Red Cloud SVG Design
                chestDesign = `
                    <g transform="translate(110, 150) scale(0.9)">
                        <path d="M 20 40 Q 10 20 30 10 Q 50 0 70 15 Q 90 0 110 15 Q 130 10 130 35 Q 140 55 120 70 Q 100 80 70 75 Q 30 80 15 60 Z" fill="#e63946" stroke="#ffffff" stroke-width="4"/>
                    </g>`;
            } else if (designType === 'sharingan') {
                // Sharingan Eye Design
                chestDesign = `
                    <g transform="translate(175, 175)">
                        <circle cx="0" cy="0" r="30" fill="#e63946" stroke="#000" stroke-width="3"/>
                        <circle cx="0" cy="0" r="10" fill="#000"/>
                        <circle cx="-16" cy="-10" r="4" fill="#000"/>
                        <circle cx="16" cy="-10" r="4" fill="#000"/>
                        <circle cx="0" cy="18" r="4" fill="#000"/>
                    </g>`;
            } else if (designType === 'kanji') {
                // Japanese Kanji / Arabic Style Design
                chestDesign = `
                    <g transform="translate(175, 175)" text-anchor="middle">
                        <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="28" fill="#e63946">暁 AKATSUKI</text>
                    </g>`;
            } else if (designType === 'sukuna') {
                // Sukuna Tattoos Graphic
                chestDesign = `
                    <g transform="translate(175, 170)" text-anchor="middle">
                        <path d="M -40 -10 L 0 20 L 40 -10 M -50 10 L 0 40 L 50 10" stroke="#e63946" stroke-width="6" fill="none" stroke-linecap="round"/>
                        <circle cx="0" cy="-15" r="8" fill="#e63946"/>
                    </g>`;
            }

            return `
            <svg viewBox="0 0 350 380" xmlns="http://www.w3.org/2000/svg">
                <!-- Hood -->
                <path d="M 115 90 Q 175 20 235 90 Q 200 65 175 65 Q 150 65 115 90 Z" fill="${colorHex}" filter="brightness(0.85)"/>
                <path d="M 130 85 Q 175 40 220 85 Q 195 70 175 70 Q 155 70 130 85 Z" fill="#151515"/>
                <!-- Hood Strings -->
                <path d="M 155 85 Q 150 130 145 155" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 195 85 Q 200 130 205 155" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
                <!-- Sleeves -->
                <path d="M 90 100 L 20 180 L 45 230 L 90 160 Z" fill="${colorHex}" filter="brightness(0.9)"/>
                <path d="M 260 100 L 330 180 L 305 230 L 260 160 Z" fill="${colorHex}" filter="brightness(0.9)"/>
                <!-- Sleeve Cuffs -->
                <path d="M 20 180 L 45 230 L 35 235 L 10 185 Z" fill="#1d1d1d"/>
                <path d="M 330 180 L 305 230 L 315 235 L 340 185 Z" fill="#1d1d1d"/>
                <!-- Body -->
                <path d="M 90 100 L 260 100 L 255 310 L 95 310 Z" fill="${colorHex}"/>
                <!-- Kangaroo Pocket -->
                <path d="M 115 230 L 235 230 L 245 300 L 105 300 Z" fill="${colorHex}" filter="brightness(0.88)" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
                <!-- Bottom Ribbing -->
                <rect x="95" y="310" width="160" height="20" fill="#1d1d1d" rx="3"/>
                <!-- Chest Graphic Design -->
                ${chestDesign}
            </svg>`;
        }

        const products = [
            {
                id: 1,
                title: "Akatsuki Cloud Embroidery Hoodie",
                price: 299,
                badge: "BESTSELLER",
                design: "cloud",
                colors: [
                    { name: "Rouge", code: "#b81d24" },
                    { name: "Noir", code: "#1a1a1a" },
                    { name: "Blanc", code: "#f8f9fa" },
                    { name: "Gris", code: "#5a6268" }
                ]
            },
            {
                id: 2,
                title: "Itachi Sharingan Eyes Hoodie",
                price: 310,
                badge: "HOT DROP",
                design: "sharingan",
                colors: [
                    { name: "Noir", code: "#1a1a1a" },
                    { name: "Rouge", code: "#b81d24" },
                    { name: "Gris", code: "#5a6268" }
                ]
            },
            {
                id: 3,
                title: "Akatsuki Kanji Kanji Streetwear Hoodie",
                price: 280,
                badge: "NEW",
                design: "kanji",
                colors: [
                    { name: "Noir", code: "#1a1a1a" },
                    { name: "Blanc", code: "#f8f9fa" },
                    { name: "Rouge", code: "#b81d24" }
                ]
            },
            {
                id: 4,
                title: "Sukuna Cursed Shrine Hoodie",
                price: 320,
                badge: "POPULAR",
                design: "sukuna",
                colors: [
                    { name: "Noir", code: "#1a1a1a" },
                    { name: "Gris", code: "#5a6268" },
                    { name: "Blanc", code: "#f8f9fa" }
                ]
            }
        ];

        let selectedSizes = {};
        let selectedColors = {};
        let cart = [];

        function selectColor(productId, colorName, colorCode, dot) {
            selectedColors[productId] = { name: colorName, code: colorCode };
            const parent = dot.parentElement;
            parent.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
            dot.classList.add('selected');
            
            // Re-render SVG mockup
            const card = dot.closest('.product-card');
            const imgWrapper = card.querySelector('.product-img-wrapper');
            const prod = products.find(p => p.id === productId);
            if (imgWrapper && prod) {
                const badge = imgWrapper.querySelector('.tag-badge').outerHTML;
                imgWrapper.innerHTML = badge + renderHoodieSVG(colorCode, prod.design);
            }
        }

        function selectSize(productId, size, btn) {
            selectedSizes[productId] = size;
            const parent = btn.parentElement;
            parent.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function displayProducts(items) {
            const container = document.getElementById('products-list');
            if (!container) return;

            container.innerHTML = items.map(p => {
                const currentSize = selectedSizes[p.id] || 'L';
                const currentColor = selectedColors[p.id] || p.colors[0];

                return `
                <div class="product-card">
                    <div class="product-img-wrapper">
                        <span class="tag-badge">${p.badge}</span>
                        ${renderHoodieSVG(currentColor.code, p.design)}
                    </div>
                    <div class="product-details">
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price} DH</div>
                        
                        <div class="option-label">Couleur:</div>
                        <div class="color-selector">
                            ${p.colors.map(c => `
                                <div class="color-dot ${currentColor.name === c.name ? 'selected' : ''}" 
                                     style="background-color: ${c.code};" 
                                     onclick="selectColor(${p.id}, '${c.name}', '${c.code}', this)"></div>
                            `).join('')}
                        </div>

                        <div class="option-label">Taille:</div>
                        <div class="size-selector">
                            <button class="size-btn ${currentSize === 'S' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'S', this)">S</button>
                            <button class="size-btn ${currentSize === 'M' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'M', this)">M</button>
                            <button class="size-btn ${currentSize === 'L' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'L', this)">L</button>
                            <button class="size-btn ${currentSize === 'XL' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'XL', this)">XL</button>
                        </div>

                        <button class="add-cart-btn" onclick="addToCart(${p.id})">
                            <i class="fas fa-shopping-bag"></i> Ajout Panier
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = products.filter(p => p.title.toLowerCase().includes(query));
            displayProducts(filtered);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const size = selectedSizes[id] || 'L';
            const color = selectedColors[id] ? selectedColors[id].name : product.colors[0].name;

            cart.push({ ...product, selectedSize: size, selectedColor: color });
            updateCartUI();
            toggleCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            
            const cartItemsContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 30px 0;">Sella ba9i khawya.</p>';
            } else {
                cartItemsContainer.innerHTML = cart.map((p, index) => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${p.title}</h4>
                            <span>Taille: <b>${p.selectedSize}</b> | Couleur: <b>${p.selectedColor}</b></span>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="cart-item-price">${p.price} DH</span>
                            <i class="fas fa-trash remove-icon" onclick="removeFromCart(${index})"></i>
                        </div>
                    </div>
                `).join('');
            }

            const total = cart.reduce((sum, p) => sum + p.price, 0);
            document.getElementById('total-price').innerText = total + " DH";
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert("Sella khawya!");
                return;
            }

            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const city = document.getElementById('cust-city').value;
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !city || !address) {
                alert("3affak 3mmar ma3loumat d-livraison كاملا!");
                return;
            }

            let message = `*NOUVELLE COMMANDE 👺 AKATSUKI HOODIES*\n\n`;
            message += `*Nom:* ${name}\n`;
            message += `*Téléphone:* ${phone}\n`;
            message += `*Ville:* ${city}\n`;
            message += `*Adresse:* ${address}\n\n`;
            message += `*Articles:* (Paiement à la livraison)\n`;

            cart.forEach((p, i) => {
                message += `${i + 1}. ${p.title} (Couleur: ${p.selectedColor}, Taille: ${p.selectedSize}) - ${p.price} DH\n`;
            });

            const total = cart.reduce((sum, p) => sum + p.price, 0);
            message += `\n*TOTAL À PAYER:* ${total} DH`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
        }

        displayProducts(products);
    </script>
</body>
</html>
