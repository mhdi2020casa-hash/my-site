<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKATSUKI STREETWEAR | Hoodies Collection 👹</title>

    <!-- Preview pour le partage sur les réseaux sociaux / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mhdi2020casa-hash.github.io/my-site/">
    <meta property="og:title" content="AKATSUKI STREETWEAR 👹 Hoodies Collection">
    <meta property="og:description" content="Afdal majmo3a d-qobiyat (Hoodies) Oversized w Ninja Style f l-Maghrib. Livraison partout au Maroc - Paiement à la livraison!">
    <meta property="og:image" content="logo.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AKATSUKI STREETWEAR 👺 Hoodies Store">
    <meta name="twitter:description" content="Afdal majmo3a d-qobiyat Oversized Ninja Style f l-Maghrib.">
    <meta name="twitter:image" content="logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #08090a;
            --bg-card: #101216;
            --accent: #e63946;
            --accent-hover: #c92a37;
            --text-main: #f1f3f5;
            --text-muted: #868e96;
            --border: #1a1d24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        .top-bar {
            background: var(--accent);
            color: #fff;
            text-align: center;
            padding: 9px 10px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 8%;
            background: rgba(8, 9, 10, 0.98);
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 50%;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .cart-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 11px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            transition: 0.3s;
        }

        .cart-btn:hover {
            border-color: var(--accent);
            background: #15181e;
        }

        .cart-badge {
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 12px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            background: #101216;
            border-bottom: 1px solid var(--border);
        }

        .hero-logo-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(230, 57, 70, 0.6));
        }

        .hero h1 {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: #fff;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 18px;
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .controls-container {
            padding: 30px 8% 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-bar {
            position: relative;
            width: 100%;
        }

        .search-bar input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--accent);
            background: #15181e;
        }

        .search-bar i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }

        .filter-tabs {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 11px 24px;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 700;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 30px 8% 70px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s transform, 0.3s border-color, 0.3s box-shadow;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.2);
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 330px;
            background: #f4f5f7;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .product-img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: 0.4s transform;
        }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.07);
        }

        .tag-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--accent);
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }

        .product-details {
            padding: 22px;
        }

        .product-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }

        .product-price {
            color: var(--accent);
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 18px;
        }

        .size-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .size-btn {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .size-btn.selected, .size-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .add-cart-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }

        .add-cart-btn:hover {
            background: var(--accent-hover);
        }

        .cart-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: flex-end;
            backdrop-filter: blur(5px);
        }

        .cart-drawer {
            background: var(--bg-card);
            width: 100%;
            max-width: 480px;
            height: 100%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-left: 2px solid var(--accent);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .cart-header h2 {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .close-cart {
            font-size: 30px;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
        }

        .close-cart:hover {
            color: #fff;
        }

        .cart-items-list {
            flex-grow: 1;
            margin: 25px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-info h4 {
            font-size: 16px;
            margin-bottom: 5px;
            color: #fff;
        }

        .cart-item-info span {
            color: var(--text-muted);
            font-size: 14px;
        }

        .cart-item-price {
            color: var(--accent);
            font-weight: 900;
            font-size: 18px;
        }

        .remove-icon {
            color: #ff4757;
            cursor: pointer;
            margin-left: 18px;
            font-size: 18px;
            transition: 0.2s;
        }

        .remove-icon:hover {
            color: #ff6b81;
            transform: scale(1.1);
        }

        .checkout-box {
            border-top: 1px solid var(--border);
            padding-top: 25px;
            margin-top: auto;
        }

        .checkout-box h3 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: #fff;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            margin-bottom: 12px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent);
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: 900;
            margin: 20px 0;
            padding: 10px 0;
            border-top: 1px solid var(--border);
        }

        .whatsapp-submit {
            width: 100%;
            background: #25D366;
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .whatsapp-submit:hover {
            background: #1eb954;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="top-bar">🔥 LIVRAISON PARTOUT AU MAROC - PAIEMENT À LA LIVRAISON 🔥</div>

    <header>
        <a href="#" class="logo-container">
            <img src="logo.png" alt="AKATSUKI Logo" class="logo-img" onerror="this.style.display='none'">
            <span class="logo-text">AKATSUKI</span>
        </a>
        <div class="header-actions">
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-badge" id="cart-count">0</span>
            </button>
        </div>
    </header>

    <section class="hero">
        <img src="logo.png" alt="AKATSUKI Logo" class="hero-logo-img" onerror="this.style.display='none'">
        <h1>AKATSUKI HOODIES</h1>
        <p>Afdal Matjar (Hoodies) Oversized, Anime, w Streetwear Style f l-Maghrib</p>
    </section>

    <div class="controls-container">
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Bhath 3la hoodie, qobiya..." oninput="filterProducts()">
        </div>
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterCategory('all', this)">Kolchi</button>
            <button class="tab-btn" onclick="filterCategory('oversized', this)">Oversized</button>
            <button class="tab-btn" onclick="filterCategory('zip', this)">Zip Hoodies</button>
            <button class="tab-btn" onclick="filterCategory('graphic', this)">Anime Graphic</button>
        </div>
    </div>

    <main class="products-grid" id="products-list"></main>

    <!-- Cart Drawer Modal -->
    <div class="cart-overlay" id="cart-modal">
        <div class="cart-drawer">
            <div class="cart-header">
                <h2>Mon Panier</h2>
                <span class="close-cart" onclick="toggleCart()">&times;</span>
            </div>

            <div class="cart-items-list" id="cart-items"></div>

            <div class="checkout-box checkout-form">
                <h3>Informations d-Livraison</h3>
                <input type="text" id="cust-name" class="form-input" placeholder="Smya w Knya" required>
                <input type="tel" id="cust-phone" class="form-input" placeholder="Nemra d-Tilifoun (06/07...)" required>
                <select id="cust-city" class="form-input">
                    <option value="">Khtar l-Madina</option>
                    <option value="Casablanca">Casablanca</option>
                    <option value="Rabat">Rabat</option>
                    <option value="Marrakech">Marrakech</option>
                    <option value="Tanger">Tanger</option>
                    <option value="Agadir">Agadir</option>
                    <option value="Fes">Fès</option>
                    <option value="Meknes">Meknès</option>
                    <option value="Oujda">Oujda</option>
                    <option value="Autre">Madina khora</option>
                </select>
                <input type="text" id="cust-address" class="form-input" placeholder="Adresse d-Livraison" required>
            </div>

            <div class="cart-summary">
                <span>Total:</span>
                <span id="total-price">0 DH</span>
            </div>

            <button class="whatsapp-submit" onclick="sendToWhatsApp()">
                Comondi direct f WhatsApp <i class="fab fa-whatsapp"></i>
            </button>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "212702418961";

        /* Vous pouvez modifier les noms de fichiers ("hoodie1.jpg", etc.) 
           selon les noms réels de vos images chargées sur GitHub. */
        const products = [
            {
                id: 1,
                title: "Oversized Hoodie Itachi Red Cloud",
                category: "oversized",
                price: 299,
                badge: "BESTSELLER",
                image: "hoodie1.jpg"
            },
            {
                id: 2,
                title: "Zip Hoodie Heavyweight Dark Shinobi",
                category: "zip",
                price: 350,
                badge: "HOT",
                image: "hoodie2.jpg"
            },
            {
                id: 3,
                title: "Graphic Anime Hoodie Sukuna Domain",
                category: "graphic",
                price: 310,
                badge: "NEW DROP",
                image: "hoodie3.jpg"
            },
            {
                id: 4,
                title: "Oversized Minimalist Black Hoodie",
                category: "oversized",
                price: 280,
                badge: "ESSENTIAL",
                image: "hoodie4.jpg"
            },
            {
                id: 5,
                title: "Full-Zip Tactical Hoodie Techwear",
                category: "zip",
                price: 360,
                badge: "TECHWEAR",
                image: "hoodie5.jpg"
            },
            {
                id: 6,
                title: "Graphic Anime Hoodie Gojo Eyes",
                category: "graphic",
                price: 320,
                badge: "POPULAR",
                image: "hoodie6.jpg"
            }
        ];

        let selectedSizes = {};
        let cart = [];
        let currentCategory = 'all';

        function selectSize(productId, size, btn) {
            selectedSizes[productId] = size;
            const parent = btn.parentElement;
            parent.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function displayProducts(items) {
            const container = document.getElementById('products-list');
            if (!container) return;

            if (items.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 18px; padding: 40px 0;">Walou malkinch had l-montaj!</p>';
                return;
            }

            container.innerHTML = items.map(p => {
                const currentSize = selectedSizes[p.id] || 'L';
                return `
                <div class="product-card">
                    <div class="product-img-wrapper">
                        <span class="tag-badge">${p.badge}</span>
                        <img src="${p.image}" alt="${p.title}" onerror="this.src='https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80'">
                    </div>
                    <div class="product-details">
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price} DH</div>
                        
                        <div class="size-selector">
                            <button class="size-btn ${currentSize === 'S' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'S', this)">S</button>
                            <button class="size-btn ${currentSize === 'M' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'M', this)">M</button>
                            <button class="size-btn ${currentSize === 'L' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'L', this)">L</button>
                            <button class="size-btn ${currentSize === 'XL' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'XL', this)">XL</button>
                        </div>

                        <button class="add-cart-btn" onclick="addToCart(${p.id})">
                            <i class="fas fa-shopping-bag"></i> Ajout Panier
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = products.filter(p => {
                const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.title.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });
            displayProducts(filtered);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const size = selectedSizes[id] || 'L';
            cart.push({ ...product, selectedSize: size });
            updateCartUI();
            toggleCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            
            const cartItemsContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 30px 0;">Sella ba9i khawya.</p>';
            } else {
                cartItemsContainer.innerHTML = cart.map((p, index) => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${p.title}</h4>
                            <span>Taille: <b>${p.selectedSize}</b></span>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="cart-item-price">${p.price} DH</span>
                            <i class="fas fa-trash remove-icon" onclick="removeFromCart(${index})"></i>
                        </div>
                    </div>
                `).join('');
            }

            const total = cart.reduce((sum, p) => sum + p.price, 0);
            document.getElementById('total-price').innerText = total + " DH";
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert("Sella khawya!");
                return;
            }

            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const city = document.getElementById('cust-city').value;
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !city || !address) {
                alert("3affak 3mmar ma3loumat d-livraison كاملا!");
                return;
            }

            let message = `*NOUVELLE COMMANDE 👺 AKATSUKI HOODIES*\n\n`;
            message += `*Nom:* ${name}\n`;
            message += `*Téléphone:* ${phone}\n`;
            message += `*Ville:* ${city}\n`;
            message += `*Adresse:* ${address}\n\n`;
            message += `*Articles:* (Paiement à la livraison)\n`;

            cart.forEach((p, i) => {
                message += `${i + 1}. ${p.title} (Taille: ${p.selectedSize}) - ${p.price} DH\n`;
            });

            const total = cart.reduce((sum, p) => sum + p.price, 0);
            message += `\n*TOTAL À PAYER:* ${total} DH`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
        }

        displayProducts(products);
    </script>
</body>
</html>
