<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKATSUKI STREETWEAR | Official Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0c0d10;
            --bg-card: #14161d;
            --accent: #e63946;
            --accent-hover: #c92a37;
            --text-main: #f8f9fa;
            --text-muted: #8d99ae;
            --border: #232733;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        .top-bar {
            background: var(--accent);
            color: #fff;
            text-align: center;
            padding: 8px 10px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            background: rgba(12, 13, 16, 0.95);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            text-decoration: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            transition: 0.3s;
        }

        .cart-btn:hover {
            border-color: var(--accent);
        }

        .cart-badge {
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 12px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: linear-gradient(180deg, rgba(12, 13, 16, 0.6) 0%, var(--bg-main) 100%), 
                        url('https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=1200&q=80') center/cover;
            border-bottom: 1px solid var(--border);
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 17px;
            max-width: 600px;
            margin: 0 auto;
        }

        .controls-container {
            padding: 30px 8% 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-bar {
            position: relative;
            width: 100%;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--accent);
        }

        .search-bar i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 28px;
            padding: 30px 8% 60px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s transform, 0.3s border-color;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 310px;
            background: #1c1f2b;
            overflow: hidden;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s transform;
        }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.05);
        }

        .tag-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .product-details {
            padding: 20px;
        }

        .product-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-price {
            color: var(--accent);
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .size-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .size-btn {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .size-btn.selected, .size-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .add-cart-btn {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .add-cart-btn:hover {
            background: var(--accent-hover);
        }

        .cart-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: flex-end;
        }

        .cart-drawer {
            background: var(--bg-card);
            width: 100%;
            max-width: 460px;
            height: 100%;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-left: 1px solid var(--border);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }

        .close-cart {
            font-size: 26px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-items-list {
            flex-grow: 1;
            margin: 20px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-info h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .cart-item-info span {
            color: var(--text-muted);
            font-size: 13px;
        }

        .cart-item-price {
            color: var(--accent);
            font-weight: 800;
        }

        .remove-icon {
            color: #ff4757;
            cursor: pointer;
            margin-left: 15px;
        }

        .checkout-box {
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .checkout-box h3 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            margin-bottom: 10px;
            outline: none;
            font-size: 14px;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
            margin: 18px 0;
        }

        .whatsapp-submit {
            width: 100%;
            background: #25D366;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }

        .whatsapp-submit:hover {
            background: #1eb954;
        }
    </style>
</head>
<body>

    <div class="top-bar">🔥 LIVRAISON PARTOUT AU MAROC - PAIEMENT À LA LIVRAISON 🔥</div>

    <header>
        <a href="#" class="logo">AKATSUKI</a>
        <div class="header-actions">
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fas fa-shopping-bag"></i>
                Panier
                <span class="cart-badge" id="cart-count">0</span>
            </button>
        </div>
    </header>

    <section class="hero">
        <h1>AKATSUKI STREETWEAR</h1>
        <p>Afdal Majo3a d-Hwayej Oversized, Anime, w Streetwear Style f l-Maghrib</p>
    </section>

    <div class="controls-container">
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Bhath 3la hoodie, t-shirt, pantalon..." oninput="filterProducts()">
        </div>
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterCategory('all', this)">Kolchi</button>
            <button class="tab-btn" onclick="filterCategory('hoodies', this)">Hoodies</button>
            <button class="tab-btn" onclick="filterCategory('tshirts', this)">T-Shirts</button>
            <button class="tab-btn" onclick="filterCategory('pants', this)">Pantalons</button>
        </div>
    </div>

    <main class="products-grid" id="products-list"></main>

    <!-- Cart Drawer Modal -->
    <div class="cart-overlay" id="cart-modal">
        <div class="cart-drawer">
            <div class="cart-header">
                <h2>Sella Dyalk</h2>
                <span class="close-cart" onclick="toggleCart()">&times;</span>
            </div>

            <div class="cart-items-list" id="cart-items"></div>

            <div class="checkout-box">
                <h3>Ma3loumat d-Livraison</h3>
                <input type="text" id="cust-name" class="form-input" placeholder="Smya w Knya" required>
                <input type="tel" id="cust-phone" class="form-input" placeholder="Nemra d-Tilifoun (06/07...)" required>
                <select id="cust-city" class="form-input">
                    <option value="">Khtar l-Madina</option>
                    <option value="Casablanca">Casablanca</option>
                    <option value="Rabat">Rabat</option>
                    <option value="Marrakech">Marrakech</option>
                    <option value="Tanger">Tanger</option>
                    <option value="Agadir">Agadir</option>
                    <option value="Fes">Fès</option>
                    <option value="Meknes">Meknès</option>
                    <option value="Oujda">Oujda</option>
                    <option value="Autre">Madina khora</option>
                </select>
                <input type="text" id="cust-address" class="form-input" placeholder="Adresse d-Livraison" required>
            </div>

            <div class="cart-summary">
                <span>Total:</span>
                <span id="total-price">0 DH</span>
            </div>

            <button class="whatsapp-submit" onclick="sendToWhatsApp()">
                Comondi dork f WhatsApp <i class="fab fa-whatsapp"></i>
            </button>
        </div>
    </div>

    <script>
        // Nemra dyalk f WhatsApp (0702418961)
        const WHATSAPP_NUMBER = "212702418961";

        const products = [
            {
                id: 1,
                title: "Oversized Hoodie Itachi Cloud",
                category: "hoodies",
                price: 299,
                badge: "BESTSELLER",
                image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 2,
                title: "T-Shirt Graphic Sukuna Trap",
                category: "tshirts",
                price: 180,
                badge: "NEW",
                image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 3,
                title: "Cargo Pants Black Trapstar",
                category: "pants",
                price: 320,
                badge: "TRENDING",
                image: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 4,
                title: "Hoodie Zip Heavyweight Dark",
                category: "hoodies",
                price: 350,
                badge: "HOT",
                image: "https://images.unsplash.com/photo-1509967419530-da38b4704bc6?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 5,
                title: "T-Shirt Oversized Gojo Domain",
                category: "tshirts",
                price: 190,
                badge: "ANIME",
                image: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 6,
                title: "Tracksuit Bottoms Oversized Fit",
                category: "pants",
                price: 280,
                badge: "POPULAR",
                image: "https://images.unsplash.com/photo-1552902865-b72c031ac5ea?auto=format&fit=crop&w=600&q=80"
            }
        ];

        let selectedSizes = {};
        let cart = [];
        let currentCategory = 'all';

        function selectSize(productId, size, btn) {
            selectedSizes[productId] = size;
            const parent = btn.parentElement;
            parent.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function displayProducts(items) {
            const container = document.getElementById('products-list');
            if (!container) return;

            if (items.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 18px; padding: 40px 0;">Walou malkinch had l-montaj!</p>';
                return;
            }

            container.innerHTML = items.map(p => {
                const currentSize = selectedSizes[p.id] || 'L';
                return `
                <div class="product-card">
                    <div class="product-img-wrapper">
                        <span class="tag-badge">${p.badge}</span>
                        <img src="${p.image}" alt="${p.title}">
                    </div>
                    <div class="product-details">
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price} DH</div>
                        
                        <div class="size-selector">
                            <button class="size-btn ${currentSize === 'S' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'S', this)">S</button>
                            <button class="size-btn ${currentSize === 'M' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'M', this)">M</button>
                            <button class="size-btn ${currentSize === 'L' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'L', this)">L</button>
                            <button class="size-btn ${currentSize === 'XL' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'XL', this)">XL</button>
                        </div>

                        <button class="add-cart-btn" onclick="addToCart(${p.id})">
                            <i class="fas fa-shopping-bag"></i> Ajout l Panier
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = products.filter(p => {
                const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.title.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });
            displayProducts(filtered);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const size = selectedSizes[id] || 'L';
            cart.push({ ...product, selectedSize: size });
            updateCartUI();
            toggleCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            
            const cartItemsContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 30px 0;">Sella dyalk ba9i khawya.</p>';
            } else {
                cartItemsContainer.innerHTML = cart.map((p, index) => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${p.title}</h4>
                            <span>Taille: <b>${p.selectedSize}</b></span>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="cart-item-price">${p.price} DH</span>
                            <i class="fas fa-trash remove-icon" onclick="removeFromCart(${index})"></i>
                        </div>
                    </div>
                `).join('');
            }

            const total = cart.reduce((sum, p) => sum + p.price, 0);
            document.getElementById('total-price').innerText = total + " DH";
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert("Sella dyalk khawya!");
                return;
            }

            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const city = document.getElementById('cust-city').value;
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !city || !address) {
                alert("3affak 3mmar ma3loumat d-livraison كاملا!");
                return;
            }

            let message = `*NOUVELLE COMMANDE - AKATSUKI STREETWEAR*\n\n`;
            message += `*Nom:* ${name}\n`;
            message += `*Téléphone:* ${phone}\n`;
            message += `*Ville:* ${city}\n`;
            message += `*Adresse:* ${address}\n\n`;
            message += `*Produits Commandés:*\n`;

            cart.forEach((p, i) => {
                message += `${i + 1}. ${p.title} (Taille: ${p.selectedSize}) - ${p.price} DH\n`;
            });

            const total = cart.reduce((sum, p) => sum + p.price, 0);
            message += `\n*TOTAL:* ${total} DH`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
        }

        displayProducts(products);
    </script>
</body>
</html>
