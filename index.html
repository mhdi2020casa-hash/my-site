<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-Matjar Dyali</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">MY STORE</div>
        <div class="cart-icon" onclick="toggleCart()">
            <i class="fas fa-shopping-cart"></i>
            <span id="cart-count">0</span>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Merhba bik f Matjar Dyalna</h1>
        <p>Afdal l-mountajat b a7san thaman!</p>
    </section>

    <!-- Products Grid -->
    <main class="products-container" id="products-list">
        <!-- Products will be loaded via JS -->
    </main>

    <!-- Cart Modal / Sidebar -->
    <div class="cart-modal" id="cart-modal">
        <div class="cart-content">
            <span class="close-btn" onclick="toggleCart()">&times;</span>
            <h2>Sella Dyalk</h2>
            <div id="cart-items"></div>
            <div class="cart-total">
                <h3>Total: <span id="total-price">0</span> DH</h3>
            </div>
            <button class="checkout-btn" onclick="sendToWhatsApp()">Acheter via WhatsApp <i class="fab fa-whatsapp"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
