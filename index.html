<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Alert</title>
    <style>
        body {
            background-color: black;
            color: red;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        /* L-écran dial l-khl3a mkhalfi f l-bidaya */
        #hacker-screen {
            display: none;
        }
        h1 {
            font-size: 45px;
            text-shadow: 0px 0px 20px red;
            animation: flicker 0.15s infinite;
        }
        p {
            font-size: 20px;
            color: #fff;
            margin-top: 15px;
        }
        .ip-address {
            color: yellow;
            font-weight: bold;
        }
        /* Style dial l-button lli kaykhalo ykiliki */
        #start-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px red;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Sawt (Audio) -->
    <audio id="prankSound" src="https://www.myinstants.com/media/sounds/warning-sound_1.mp3" preload="auto" loop></audio>

    <!-- Mar7la 1: Button bach ykiliki (Khasso ykoun ضروري bach ykhdm sowt f telephone) -->
    <div id="welcome-screen">
        <h2 style="color: white; margin-bottom: 20px;">🎉 Mabrouk 3lik! Rba7ti Jayeza Kbira 🎁</h2>
        <button id="start-btn" onclick="startPrank()">Dkhol Chof Jayeza Dyalek 📲</button>
    </div>

    <!-- Mar7la 2: Screen dial l-Khlc (Katban mor l-click) -->
    <div id="hacker-screen">
        <h1>⚠️ ATTENTION: SYSTEM COMPROMISED ⚠️</h1>
        <p>Suspicious activity detected on this IP: <span class="ip-address">173.245.48.0</span></p>
        <p>Your location has been tracked. Data extraction is in progress...</p>
        <p>Do not turn off your device. Your files are being encrypted.</p>
    </div>

    <script>
        function startPrank() {
            // 1. Khfi welcome screen w byan hacker screen
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('hacker-screen').style.display = 'block';

            // 2. Khdm l-sawt b sor3a
            var audio = document.getElementById('prankSound');
            audio.play();

            // 3. Dir Fullscreen (Ila momkin f téléphone/pc)
            var el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen();
            }

            // 4. Mor 5 saniyat, wqqf l-sawt w tla3 l-message
            setTimeout(function() {
                audio.pause();
                alert("Malak makhloç? Mtkhlaç ma walo ra dahkin! 😂🔥");
            }, 5000);
        }
    </script>

</body>
</html>
