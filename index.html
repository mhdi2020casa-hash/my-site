<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Updating Windows</title>
    <style>
        body {
            background-color: #0078D7;
            color: white;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: none;
        }
        .spinner {
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            opacity: 0.8;
        }
        .percentage {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <h1>Updating Windows</h1>
    <p>Please keep your computer on. Working on updates <span id="percent" class="percentage">12</span>%</p>
    <p style="margin-top: 40px; font-size: 14px;">This might take a while. Your PC may restart several times.</p>

    <script>
        let p = 12;
        let interval = setInterval(function() {
            p += Math.floor(Math.random() * 3) + 1; // Katzid bchwiya bchwiya bach tban 7a9i9iya
            if (p >= 99) {
                p = 99; // Katw9af f 99% ou tatb9a ttsenna
                clearInterval(interval);
                
                // Mor 3 saniyat mn l-wosol l 99%, katban l-prank
                setTimeout(function() {
                    alert("Tcheditiiiii! Rah gha prank dyal Windows Update! 😂 Hhhhh");
                    location.reload(); // Kat3awd t7l mn jdid
                }, 4000);
            }
            document.getElementById('percent').innerText = p;
        }, 800); // Kol 0.8 sanya katzid chwiya
    </script>

</body>
</html>
