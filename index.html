<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKATSUKI STREETWEAR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0b0d;
            --card-bg: #16161a;
            --accent-color: #e63946;
            --text-color: #f1f1f1;
            --text-muted: #a0a0a0;
            --border-color: #2a2a30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(11, 11, 13, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent-color);
        }

        .cart-icon {
            font-size: 22px;
            cursor: pointer;
            position: relative;
        }

        #cart-count {
            background: var(--accent-color);
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 12px;
            position: absolute;
            top: -8px;
            right: -12px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: #111116;
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #fff;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 40px 8%;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-price {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .add-to-cart {
            width: 100%;
            padding: 10px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: flex-end;
            z-index: 1000;
        }

        .cart-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            height: 100%;
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .close-btn {
            font-size: 28px;
            cursor: pointer;
            align-self: flex-end;
        }

        #cart-items {
            flex-grow: 1;
            margin-top: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .checkout-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">AKATSUKI</div>
        <div class="cart-icon" onclick="toggleCart()">
            <i class="fas fa-shopping-bag"></i>
            <span id="cart-count">0</span>
        </div>
    </header>

    <section class="hero">
        <h1>AKATSUKI STREETWEAR</h1>
        <p>Collection Exclusive 2026</p>
    </section>

    <main class="products-container" id="products-list"></main>

    <div class="cart-modal" id="cart-modal">
        <div class="cart-content">
            <span class="close-btn" onclick="toggleCart()">&times;</span>
            <h2>Mon Panier</h2>
            <div id="cart-items"></div>
            <div style="margin-top: 15px; font-weight: bold;">
                Total: <span id="total-price">0</span> DH
            </div>
            <button class="checkout-btn" onclick="sendToWhatsApp()">Commander sur WhatsApp</button>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "212600000000";

        const products = [
            { id: 1, title: "Oversized Hoodie - Itachi Edition", price: 299, image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500" },
            { id: 2, title: "T-Shirt Graphic - Sukuna Trap", price: 180, image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" },
            { id: 3, title: "Cargo Pants Black Streetwear", price: 320, image: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=500" }
        ];

        let cart = [];

        function displayProducts() {
            const container = document.getElementById('products-list');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image}" alt="${p.title}">
                    <div class="product-info">
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price} DH</div>
                        <button class="add-to-cart" onclick="addToCart(${p.id})">Ajouter au panier</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCart();
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = cart.map(p => `
                <div class="cart-item">
                    <span>${p.title}</span>
                    <span><b>${p.price} DH</b></span>
                </div>
            `).join('');
            const total = cart.reduce((sum, p) => sum + p.price, 0);
            document.getElementById('total-price').innerText = total;
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        function sendToWhatsApp() {
            if (cart.length === 0) return alert("Panier vide !");
            let msg = "Salam, je veux commander:\n\n";
            cart.forEach((p, i) => msg += `${i + 1}. ${p.title} - ${p.price} DH\n`);
            const total = cart.reduce((sum, p) => sum + p.price, 0);
            msg += `\nTotal: ${total} DH`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        displayProducts();
    </script>
</body>
</html>
