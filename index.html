<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKATSUKI STREETWEAR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121214; color: #fff; padding-bottom: 50px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: #1a1a1e; border-bottom: 2px solid #e63946; }
        .logo { font-size: 24px; font-weight: bold; color: #e63946; }
        .hero { text-align: center; padding: 40px 20px; background: #1a1a1e; margin-bottom: 30px; }
        .hero h1 { font-size: 32px; margin-bottom: 10px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 0 8%; }
        .card { background: #1a1a1e; border: 1px solid #333; border-radius: 8px; overflow: hidden; padding: 15px; text-align: center; }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 6px; }
        .card h3 { margin: 15px 0 10px; font-size: 18px; }
        .card p { color: #e63946; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
        .btn { background: #25D366; color: #fff; text-decoration: none; padding: 10px 15px; border-radius: 5px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo">AKATSUKI STREETWEAR</div>
    </header>

    <section class="hero">
        <h1>Bienvenue chez AKATSUKI</h1>
        <p>Commandez vos vêtements directement sur WhatsApp</p>
    </section>

    <main class="products">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500" alt="Hoodie">
            <h3>Oversized Hoodie Itachi</h3>
            <p>299 DH</p>
            <a href="https://wa.me/212600000000?text=Je%20veux%20commander%20Oversized%20Hoodie%20Itachi" class="btn" target="_blank">Commander via WhatsApp</a>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="T-Shirt">
            <h3>T-Shirt Graphic Sukuna</h3>
            <p>180 DH</p>
            <a href="https://wa.me/212600000000?text=Je%20veux%20commander%20T-Shirt%20Sukuna" class="btn" target="_blank">Commander via WhatsApp</a>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=500" alt="Pantalon">
            <h3>Cargo Pants Black</h3>
            <p>320 DH</p>
            <a href="https://wa.me/212600000000?text=Je%20veux%20commander%20Cargo%20Pants%20Black" class="btn" target="_blank">Commander via WhatsApp</a>
        </div>
    </main>

</body>
</html>
