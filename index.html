<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKATSUKI STREETWEAR | Hoodies Collection</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0b0e;
            --bg-card: #12141a;
            --accent: #e63946;
            --accent-hover: #c92a37;
            --text-main: #f1f3f5;
            --text-muted: #868e96;
            --border: #1e222d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        .top-bar {
            background: var(--accent);
            color: #fff;
            text-align: center;
            padding: 9px 10px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background: rgba(10, 11, 14, 0.98);
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .cart-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .cart-btn:hover {
            border-color: var(--accent);
        }

        .cart-badge {
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 12px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 50px 20px 30px;
            background: #12141a;
            border-bottom: 1px solid var(--border);
        }

        .hero h1 {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #fff;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .controls-container {
            padding: 25px 8% 10px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .search-bar {
            position: relative;
            width: 100%;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .search-bar i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
            padding: 25px 8% 60px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s transform, 0.3s border-color;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 300px;
            background: #1a1d26;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tag-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .product-details {
            padding: 20px;
        }

        .product-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .product-price {
            color: var(--accent);
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .option-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .color-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .color-dot.selected {
            border-color: var(--accent);
            transform: scale(1.15);
        }

        .size-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .size-btn {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .size-btn.selected, .size-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .add-cart-btn {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .add-cart-btn:hover {
            background: var(--accent-hover);
        }

        /* Cart Modal Drawer */
        .cart-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: flex-end;
        }

        .cart-drawer {
            background: var(--bg-card);
            width: 100%;
            max-width: 450px;
            height: 100%;
            padding: 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-left: 2px solid var(--accent);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .close-cart {
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-items-list {
            flex-grow: 1;
            margin: 20px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .checkout-box {
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            margin-bottom: 10px;
            outline: none;
            font-size: 14px;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
            margin: 15px 0;
        }

        .whatsapp-submit {
            width: 100%;
            background: #25D366;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }

        .whatsapp-submit:hover {
            background: #1eb954;
        }
    </style>
</head>
<body>

    <div class="top-bar">🔥 LIVRAISON PARTOUT AU MAROC - PAIEMENT À LA LIVRAISON 🔥</div>

    <header>
        <a href="#" class="logo-container">
            <span class="logo-text">AKATSUKI</span>
        </a>
        <button class="cart-btn" onclick="toggleCart()">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-badge" id="cart-count">0</span>
        </button>
    </header>

    <section class="hero">
        <h1>AKATSUKI HOODIES</h1>
        <p>Collection Exclusive Oversized & Anime Streetwear Style</p>
    </section>

    <div class="controls-container">
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Rechercher un produit..." oninput="filterProducts()">
        </div>
    </div>

    <main class="products-grid" id="products-list"></main>

    <!-- Cart Modal -->
    <div class="cart-overlay" id="cart-modal">
        <div class="cart-drawer">
            <div class="cart-header">
                <h2>Mon Panier</h2>
                <span class="close-cart" onclick="toggleCart()">&times;</span>
            </div>

            <div class="cart-items-list" id="cart-items"></div>

            <div class="checkout-box">
                <h3 style="margin-bottom: 10px; font-size: 15px;">Informations de livraison</h3>
                <input type="text" id="cust-name" class="form-input" placeholder="Nom et Prénom" required>
                <input type="tel" id="cust-phone" class="form-input" placeholder="Numéro de téléphone" required>
                <select id="cust-city" class="form-input">
                    <option value="">Sélectionnez la ville</option>
                    <option value="Casablanca">Casablanca</option>
                    <option value="Rabat">Rabat</option>
                    <option value="Marrakech">Marrakech</option>
                    <option value="Tanger">Tanger</option>
                    <option value="Agadir">Agadir</option>
                    <option value="Fes">Fès</option>
                    <option value="Meknes">Meknès</option>
                    <option value="Oujda">Oujda</option>
                    <option value="Autre">Autre ville</option>
                </select>
                <input type="text" id="cust-address" class="form-input" placeholder="Adresse de livraison" required>
            </div>

            <div class="cart-summary">
                <span>Total:</span>
                <span id="total-price">0 DH</span>
            </div>

            <button class="whatsapp-submit" onclick="sendToWhatsApp()">
                Commander via WhatsApp <i class="fab fa-whatsapp"></i>
            </button>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "212702418961";

        const products = [
            {
                id: 1,
                title: "Hoodie Oversized Akatsuki Cloud",
                price: 299,
                badge: "BESTSELLER",
                colors: [
                    { name: "Rouge", code: "#e63946", img: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80" },
                    { name: "Noir", code: "#111111", img: "https://images.unsplash.com/photo-1509967419530-da38b4704bc6?auto=format&fit=crop&w=600&q=80" },
                    { name: "Blanc", code: "#ffffff", img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=600&q=80" }
                ]
            },
            {
                id: 2,
                title: "Hoodie Sukuna Shrine Edition",
                price: 320,
                badge: "NEW",
                colors: [
                    { name: "Noir", code: "#111111", img: "https://images.unsplash.com/photo-1509967419530-da38b4704bc6?auto=format&fit=crop&w=600&q=80" },
                    { name: "Gris", code: "#7f8c8d", img: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80" }
                ]
            },
            {
                id: 3,
                title: "Hoodie Itachi Sharingan",
                price: 310,
                badge: "POPULAR",
                colors: [
                    { name: "Noir", code: "#111111", img: "https://images.unsplash.com/photo-1509967419530-da38b4704bc6?auto=format&fit=crop&w=600&q=80" },
                    { name: "Rouge", code: "#e63946", img: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80" }
                ]
            },
            {
                id: 4,
                title: "Hoodie Gojo Unlimited Void",
                price: 330,
                badge: "LIMITED",
                colors: [
                    { name: "Blanc", code: "#ffffff", img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=600&q=80" },
                    { name: "Noir", code: "#111111", img: "https://images.unsplash.com/photo-1509967419530-da38b4704bc6?auto=format&fit=crop&w=600&q=80" }
                ]
            }
        ];

        let selectedSizes = {};
        let selectedColors = {};
        let cart = [];

        function selectColor(productId, colorName, colorImg, dot) {
            selectedColors[productId] = { name: colorName, img: colorImg };
            const parent = dot.parentElement;
            parent.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
            dot.classList.add('selected');
            
            const card = dot.closest('.product-card');
            const imgEl = card.querySelector('.product-img-wrapper img');
            if (imgEl) imgEl.src = colorImg;
        }

        function selectSize(productId, size, btn) {
            selectedSizes[productId] = size;
            const parent = btn.parentElement;
            parent.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function displayProducts(items) {
            const container = document.getElementById('products-list');
            if (!container) return;

            if (items.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">Aucun produit trouvé.</p>';
                return;
            }

            container.innerHTML = items.map(p => {
                const currentSize = selectedSizes[p.id] || 'L';
                const currentColor = selectedColors[p.id] || p.colors[0];

                return `
                <div class="product-card">
                    <div class="product-img-wrapper">
                        <span class="tag-badge">${p.badge}</span>
                        <img src="${currentColor.img}" alt="${p.title}">
                    </div>
                    <div class="product-details">
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price} DH</div>
                        
                        <div class="option-label">Couleur:</div>
                        <div class="color-selector">
                            ${p.colors.map(c => `
                                <div class="color-dot ${currentColor.name === c.name ? 'selected' : ''}" 
                                     style="background-color: ${c.code};" 
                                     onclick="selectColor(${p.id}, '${c.name}', '${c.img}', this)"></div>
                            `).join('')}
                        </div>

                        <div class="option-label">Taille:</div>
                        <div class="size-selector">
                            <button class="size-btn ${currentSize === 'S' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'S', this)">S</button>
                            <button class="size-btn ${currentSize === 'M' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'M', this)">M</button>
                            <button class="size-btn ${currentSize === 'L' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'L', this)">L</button>
                            <button class="size-btn ${currentSize === 'XL' ? 'selected' : ''}" onclick="selectSize(${p.id}, 'XL', this)">XL</button>
                        </div>

                        <button class="add-cart-btn" onclick="addToCart(${p.id})">
                            <i class="fas fa-shopping-bag"></i> Ajouter au Panier
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = products.filter(p => p.title.toLowerCase().includes(query));
            displayProducts(filtered);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const size = selectedSizes[id] || 'L';
            const color = selectedColors[id] ? selectedColors[id].name : product.colors[0].name;

            cart.push({ ...product, selectedSize: size, selectedColor: color });
            updateCartUI();
            toggleCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            
            const cartItemsContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 30px 0;">Votre panier est vide.</p>';
            } else {
                cartItemsContainer.innerHTML = cart.map((p, index) => `
                    <div class="cart-item">
                        <div>
                            <h4 style="font-size: 14px;">${p.title}</h4>
                            <span style="font-size: 12px; color: var(--text-muted);">Taille: <b>${p.selectedSize}</b> | Couleur: <b>${p.selectedColor}</b></span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="color: var(--accent); font-weight: bold;">${p.price} DH</span>
                            <i class="fas fa-trash" style="color: #ff4757; cursor: pointer;" onclick="removeFromCart(${index})"></i>
                        </div>
                    </div>
                `).join('');
            }

            const total = cart.reduce((sum, p) => sum + p.price, 0);
            document.getElementById('total-price').innerText = total + " DH";
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                alert("Votre panier est vide !");
                return;
            }

            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const city = document.getElementById('cust-city').value;
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !city || !address) {
                alert("Veuillez remplir toutes les informations de livraison.");
                return;
            }

            let message = `*NOUVELLE COMMANDE - AKATSUKI HOODIES*\n\n`;
            message += `*Nom:* ${name}\n`;
            message += `*Téléphone:* ${phone}\n`;
            message += `*Ville:* ${city}\n`;
            message += `*Adresse:* ${address}\n\n`;
            message += `*Articles:*\n`;

            cart.forEach((p, i) => {
                message += `${i + 1}. ${p.title} (${p.selectedColor}, Taille: ${p.selectedSize}) - ${p.price} DH\n`;
            });

            const total = cart.reduce((sum, p) => sum + p.price, 0);
            message += `\n*TOTAL:* ${total} DH`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // Affichage initial
        displayProducts(products);
    </script>
</body>
</html>
