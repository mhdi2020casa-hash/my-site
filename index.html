<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Alert</title>
    <style>
        body {
            background-color: black;
            color: red;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding-top: 20vh;
            animation: flicker 0.15s infinite;
            overflow: hidden;
            margin: 0;
            cursor: none;
        }
        h1 {
            font-size: 60px;
            text-shadow: 0px 0px 20px red;
        }
        p {
            font-size: 25px;
            color: #fff;
            margin-top: 20px;
        }
        .ip-address {
            color: yellow;
            font-weight: bold;
            font-size: 1.2em;
        }
        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Sawt (Audio) lli ghadi yakhdm automatic -->
    <audio id="prankSound" src="https://www.myinstants.com/media/sounds/warning-sound_1.mp3" preload="auto" loop></audio>

    <h1>⚠️ ATTENTION: SYSTEM COMPROMISED ⚠️</h1>
    <p>Suspicious activity detected on this IP: <span id="userip" class="ip-address">Loading IP...</span></p>
    <p>Your location has been tracked. Data extraction is in progress...</p>
    <p>Do not turn off your device. Your files are being encrypted.</p>

    <script>
        document.getElementById('userip').innerText = "173.245.48.0 (Approximate Location: Morocco)";

        // Khdm l-sawt otomatik mni t7l l-page
        window.addEventListener('load', function() {
            var audio = document.getElementById('prankSound');
            audio.play().catch(function(error) {
                // Ila l-browser mn3 l-autoplay, ghadi ykhdm gha ykiliki f ay blasa
                document.body.addEventListener('click', function() {
                    audio.play();
                }, { once: true });
            });
        });

        // L-message l-jdid mor 5 saniyat
        setTimeout(function() {
            var audio = document.getElementById('prankSound');
            audio.pause(); // Ywqqf l-sawt mni ytla3 l-message
            alert("Malak makhloç? Mtkhlaç ma walo ra dahkin! 😂🔥");
        }, 5000);

        document.body.addEventListener('click', function() {
            var el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen();
            }
        }, { once: true });
    </script>

</body>
</html>
